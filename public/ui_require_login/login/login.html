<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Login</title>
    <link rel="icon" type="image/png" href="/favicons/itgi-favicon2.png">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        background: radial-gradient(circle at top, #001d3d, #000814);
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 40px;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      /* .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        font-size: 30px;
        font-weight: bold;
        box-shadow: 0 10px 30px rgba(0, 180, 216, 0.25);
      } */

      .logo {
        width: 110px;
        height: 90px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border-radius: 0;
        filter: drop-shadow(0 8px 20px rgba(0, 70, 67, 0.25));
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #9fb3c8;
        font-size: 14px;
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #c9d6e4;
      }

      input {
        width: 100%;
        padding: 13px 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        outline: none;
        font-size: 15px;
        transition:
          border 0.2s,
          box-shadow 0.2s;
      }

      input:focus {
        border-color: #00b4d8;
        box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.12);
      }

      input::placeholder {
        color: #718096;
      }

      .password-wrapper {
        position: relative;
      }

      .password-wrapper input {
        padding-right: 65px;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 13px;
      }

      .toggle-password:hover {
        color: white;
      }

      /* REMEMBER ME */
      .remember-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: -5px;
        margin-bottom: 20px;
      }

      .remember-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: #aebdce;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }

      .remember-label input {
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
        cursor: pointer;
        accent-color: #00b4d8;
      }

      .login-button {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px;
        margin-top: 5px;
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      .login-button:hover {
        transform: translateY(-1px);
      }

      .login-button:disabled {
        opacity: 0.6;

        cursor: not-allowed;

        transform: none;
      }

      .error-message {
        display: none;
        margin-bottom: 20px;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgba(220, 38, 38, 0.15);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #fca5a5;
        font-size: 14px;
        line-height: 1.4;
      }

      .footer {
        margin-top: 25px;
        text-align: center;
        color: #64748b;
        font-size: 12px;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <!-- <div class="logo">K</div> -->

        <div class="logo">
          <img
            src="https://res.cloudinary.com/itxeeydk/image/upload/v1786588547/it_gi_logo_xm001z.png"
            alt="ITGI Logo"
          />
        </div>

        <h1>Kanban System</h1>

        <div class="subtitle">Production Monitoring System</div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username"> Username </label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
              />

              <button type="button" class="toggle-password" id="togglePassword">
                Show
              </button>
            </div>
          </div>

          <!-- REMEMBER ME -->
          <div class="remember-row">
            <label class="remember-label" for="rememberMe">
              <input type="checkbox" id="rememberMe" />

              <span> Remember me </span>
            </label>
          </div>

          <button type="submit" class="login-button" id="loginButton">
            Sign In
          </button>
        </form>

        <div class="footer">Kanban Production Monitoring</div>
      </div>
    </div>

    <script src="/common/js/auth.js"></script>
    <script src="/ui_require_login/login/login.js"></script>
  </body>
</html>
