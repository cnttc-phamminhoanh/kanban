<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Dashboard</title>
  <link rel="icon" type="image/png" href="/favicons/itgi-favicon2.png">
  <link rel="stylesheet" href="/ui/monitor/monitor.css" />
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>
        <span class="factory-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 21V10l6 3V8l6 3" />
            <path d="M15 21V3h4l2 18H3" />
            <path d="M7 17h1m3 0h1m5 0h1" />
          </svg>
        </span> FACTORY DASHBOARD
      </h1>
      <div class="legend" aria-label="Ngưỡng hiệu suất">
        <span><i class="dot red"></i>Đỏ &lt;75%</span><span><i class="dot orange"></i>Cam 75-89%</span>
        <span><i class="dot yellow"></i>Vàng 90-99%</span><span><i class="dot green"></i>Xanh ≥100%</span>
      </div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search"
          placeholder="Tìm kiếm chuyền may..." aria-label="Tìm kiếm chuyền may"></label>
    </header>
    <nav class="toolbar" aria-label="Bộ lọc và quản lý">
      <div id="areaFilters" class="filters"></div>

      <div class="actions">
        <a class="management-btn" href="/pms/monitor/flowPlan">
          <svg class="management-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
              d="m9.5 3-.5 2a7.4 7.4 0 0 0-1.5.9l-2-.6L3 9.7l1.5 1.4a7.8 7.8 0 0 0 0 1.8L3 14.3l2.5 4.4 2-.6a7.4 7.4 0 0 0 1.5.9l.5 2h5l.5-2a7.4 7.4 0 0 0 1.5-.9l2 .6 2.5-4.4-1.5-1.4a7.8 7.8 0 0 0 0-1.8L21 9.7l-2.5-4.4-2 .6A7.4 7.4 0 0 0 15 5l-.5-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          MANAGEMENT
        </a>
      </div>
    </nav>
    <p id="status" class="status" role="status">Đang tải danh sách chuyền...</p>
    <button id="retry" class="retry" hidden>Thử lại</button>
    <div id="flowContainer" class="regions"></div>
  </main>
  <script src="/ui/monitor/monitor.js"></script>
</body>

</html>
